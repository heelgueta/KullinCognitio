<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MañkeAnalytica</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #0d0f17;
    --surface: #14162050;
    --surface2:#1a1d2e;
    --border:  #252840;
    --accent:  #9b7dd4;
    --accent2: #7a5eb8;
    --text:    #d2d0e0;
    --muted:   #5e5c7a;
    --ok:      #6db88c;
    --warn:    #d4b86a;
    --err:     #d05060;
    --radius:  8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    padding: 18px 32px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  header p  { color: var(--muted); font-size: 12px; }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: calc(100vh - 57px);
  }
  .panel {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .panel-section {
    padding: 16px 16px;
    border-bottom: 1px solid var(--border);
  }
  .main { overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }

  .sec-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: .9px; color: var(--muted); margin-bottom: 10px;
  }

  .file-list { display: flex; flex-direction: column; gap: 6px; }
  .file-card {
    padding: 9px 11px; border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .file-card:hover  { border-color: var(--accent); background: rgba(155,125,212,.05); }
  .file-card.active { border-color: var(--accent); background: rgba(155,125,212,.1); }
  .file-card .fname { font-size: 11px; font-weight: 600; color: var(--text); word-break: break-all; }
  .file-card .fmeta { font-size: 10px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .ftag {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 1px 5px; border-radius: 3px; margin-right: 3px; margin-top: 3px;
    background: rgba(155,125,212,.15); color: var(--accent);
    border: 1px solid rgba(155,125,212,.3);
  }
  .empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 0; }

  .btn-analyse {
    width: 100%; padding: 10px;
    background: var(--accent); color: #0d0f17;
    border: none; border-radius: var(--radius);
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: background .15s; margin-top: 10px;
  }
  .btn-analyse:hover    { background: var(--accent2); color: #fff; }
  .btn-analyse:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* stats overview */
  .stat-pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill {
    flex: 1; min-width: 110px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; text-align: center;
  }
  .pill .pval { font-size: 22px; font-weight: 700; color: var(--accent); }
  .pill .plbl { font-size: 10px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .7px; }

  /* chart cards */
  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .chart-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .chart-card.wide { grid-column: 1 / -1; }
  .chart-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 12px; }
  .chart-wrap  { position: relative; height: 220px; }
  .chart-wrap.tall { height: 300px; }

  /* toggle temporal granularity */
  .gran-tabs { display: flex; gap: 0; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; width: fit-content; }
  .gran-tab {
    padding: 4px 12px; font-size: 11px; font-weight: 600; color: var(--muted);
    background: transparent; border: none; cursor: pointer; transition: background .15s, color .15s;
  }
  .gran-tab.active { background: var(--accent); color: #0d0f17; }

  #placeholder {
    text-align: center; padding: 60px 20px; color: var(--muted);
    font-size: 13px; line-height: 2;
  }
  #placeholder .big { font-size: 42px; display: block; margin-bottom: 10px; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>🦅 MañkeAnalytica</h1>
  <p><em>mañke</em> (cóndor, mapudungun) + <em>analytica</em> (latín) &mdash; análisis estadístico del corpus</p>
</header>

<div class="layout">

  <!-- LEFT -->
  <div class="panel">
    <div class="panel-section">
      <div class="sec-label">Corpus disponible</div>
      <div class="file-list" id="file-list">
        <div class="empty">Buscando archivos…</div>
      </div>
      <button class="btn-analyse" id="analyse-btn" onclick="runAnalysis()" disabled>
        Selecciona un archivo
      </button>
    </div>
    <div class="panel-section" style="flex:1">
      <div class="sec-label">Fuente</div>
      <div id="source-label" style="font-size:11px;color:var(--muted);font-style:italic">—</div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="main" id="main-content">
    <div id="placeholder">
      <span class="big">🦅</span>
      Selecciona un CSV para ver los análisis
    </div>
  </div>

</div>

<script>
let selectedFile = null;
let statsData    = null;
let charts       = {};
let granularity  = 'month';

const ACCENT  = '#9b7dd4';
const ACCENT2 = '#7a5eb8';
const OK      = '#6db88c';
const WARN    = '#d4b86a';
const MUTED   = '#5e5c7a';
const BORDER  = '#252840';
const TEXT    = '#d2d0e0';

const PALETTE = [
  '#9b7dd4','#6db88c','#d4b86a','#d05060','#5ba8d4',
  '#d47d9b','#7dd4b8','#d49b7d','#7d9bd4','#b8d46d',
];

Chart.defaults.color          = TEXT;
Chart.defaults.borderColor    = BORDER;
Chart.defaults.font.family    = "'Segoe UI', system-ui, sans-serif";
Chart.defaults.font.size      = 11;

async function loadFiles() {
  try {
    const r = await fetch('/files');
    const d = await r.json();
    document.getElementById('source-label').textContent =
      d.source === 'narki' ? 'ÑarkiMundatio (limpio)' :
      d.source === 'culpem' ? 'CulpemCorpus (crudo)' : 'sin datos';

    const list = document.getElementById('file-list');
    if (!d.files.length) {
      list.innerHTML = '<div class="empty">Sin archivos encontrados.<br>Ejecuta ÑarkiMundatio o CulpemCorpus primero.</div>';
      return;
    }
    list.innerHTML = '';
    d.files.forEach(f => {
      const m = f.meta;
      const tags = [];
      if (m.query || m.source_file) tags.push(m.query || m.source_file);
      if (m.n_articles || m.n_output) tags.push((m.n_articles || m.n_output) + ' filas');
      if (m.created_at) tags.push(m.created_at.slice(0,10));

      const card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML = `
        <div class="fname">${f.name}</div>
        <div class="fmeta">
          ${(f.size/1024).toFixed(1)} KB
          ${tags.map(t => `<span class="ftag">${t}</span>`).join('')}
        </div>`;
      card.onclick = () => selectFile(f.name, card);
      list.appendChild(card);
    });
  } catch(e) { console.error(e); }
}

function selectFile(name, cardEl) {
  selectedFile = name;
  document.querySelectorAll('.file-card').forEach(c => c.classList.remove('active'));
  cardEl.classList.add('active');
  const btn = document.getElementById('analyse-btn');
  btn.disabled = false;
  btn.textContent = 'Analizar →';
}

async function runAnalysis() {
  if (!selectedFile) return;
  document.getElementById('analyse-btn').disabled = true;
  document.getElementById('analyse-btn').textContent = 'Analizando…';

  try {
    const r = await fetch('/analyse?file=' + encodeURIComponent(selectedFile));
    statsData = await r.json();
    if (statsData.error) { alert(statsData.error); return; }
    renderDashboard();
  } catch(e) {
    alert('Error al analizar: ' + e);
  } finally {
    document.getElementById('analyse-btn').disabled = false;
    document.getElementById('analyse-btn').textContent = 'Analizar →';
  }
}

function renderDashboard() {
  // destroy old charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  const d = statsData;
  const mc = document.getElementById('main-content');

  mc.innerHTML = `
    <!-- pills -->
    <div class="stat-pills">
      <div class="pill"><div class="pval">${d.n.toLocaleString()}</div><div class="plbl">Filas</div></div>
      <div class="pill"><div class="pval">${d.sources.length}</div><div class="plbl">Fuentes</div></div>
      <div class="pill"><div class="pval">${d.lengths.avg}</div><div class="plbl">Palabras prom.</div></div>
      <div class="pill"><div class="pval">${d.lengths.max.toLocaleString()}</div><div class="plbl">Máx. palabras</div></div>
      <div class="pill"><div class="pval">${d.temporal.by_year.length}</div><div class="plbl">Años</div></div>
    </div>

    <!-- temporal -->
    <div class="chart-card wide">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="chart-title">Volumen temporal de artículos</div>
        <div class="gran-tabs">
          <button class="gran-tab ${granularity==='year'?'active':''}" onclick="setGran('year')">Año</button>
          <button class="gran-tab ${granularity==='month'?'active':''}" onclick="setGran('month')">Mes</button>
          <button class="gran-tab ${granularity==='date'?'active':''}" onclick="setGran('date')">Día</button>
        </div>
      </div>
      <div class="chart-wrap tall"><canvas id="ch-temporal"></canvas></div>
    </div>

    <div class="chart-grid">

      <!-- sources -->
      <div class="chart-card">
        <div class="chart-title">Artículos por fuente</div>
        <div class="chart-wrap"><canvas id="ch-sources"></canvas></div>
      </div>

      <!-- lengths -->
      <div class="chart-card">
        <div class="chart-title">Distribución de largo (palabras)</div>
        <div class="chart-wrap"><canvas id="ch-lengths"></canvas></div>
      </div>

      <!-- top words -->
      <div class="chart-card wide">
        <div class="chart-title">Palabras más frecuentes (top 30)</div>
        <div class="chart-wrap tall"><canvas id="ch-words"></canvas></div>
      </div>

    </div>`;

  drawTemporal();
  drawSources();
  drawLengths();
  drawWords();
}

function setGran(g) {
  granularity = g;
  document.querySelectorAll('.gran-tab').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().startsWith(g === 'date' ? 'd' : g === 'month' ? 'm' : 'a')));
  if (charts['temporal']) { charts['temporal'].destroy(); delete charts['temporal']; }
  drawTemporal();
}

function drawTemporal() {
  const d = statsData;
  const series = granularity === 'year' ? d.temporal.by_year :
                 granularity === 'month' ? d.temporal.by_month :
                 d.temporal.by_date;
  if (!series.length) return;
  const ctx = document.getElementById('ch-temporal').getContext('2d');
  charts['temporal'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: series.map(x => x[0]),
      datasets: [{
        data: series.map(x => x[1]),
        backgroundColor: ACCENT + '99',
        borderColor: ACCENT,
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: BORDER }, ticks: { maxRotation: 45 } },
        y: { grid: { color: BORDER }, beginAtZero: true }
      }
    }
  });
}

function drawSources() {
  const src = statsData.sources.slice(0, 12);
  const ctx = document.getElementById('ch-sources').getContext('2d');
  charts['sources'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: src.map(x => x[0]),
      datasets: [{
        data: src.map(x => x[1]),
        backgroundColor: src.map((_, i) => PALETTE[i % PALETTE.length] + 'bb'),
        borderColor:     src.map((_, i) => PALETTE[i % PALETTE.length]),
        borderWidth: 1, borderRadius: 3,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: BORDER }, beginAtZero: true },
        y: { grid: { color: BORDER } }
      }
    }
  });
}

function drawLengths() {
  const bkts = statsData.lengths.buckets;
  const ctx  = document.getElementById('ch-lengths').getContext('2d');
  charts['lengths'] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: bkts.map(x => x[0]),
      datasets: [{
        data: bkts.map(x => x[1]),
        backgroundColor: PALETTE.slice(0, bkts.length).map(c => c + 'cc'),
        borderColor: PALETTE.slice(0, bkts.length),
        borderWidth: 1,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } }
      }
    }
  });
}

function drawWords() {
  const words = statsData.top_words.slice(0, 30);
  const ctx   = document.getElementById('ch-words').getContext('2d');
  charts['words'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: words.map(x => x[0]),
      datasets: [{
        data: words.map(x => x[1]),
        backgroundColor: words.map((_, i) => PALETTE[i % PALETTE.length] + 'aa'),
        borderColor:     words.map((_, i) => PALETTE[i % PALETTE.length]),
        borderWidth: 1, borderRadius: 3,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: BORDER }, ticks: { maxRotation: 45 } },
        y: { grid: { color: BORDER }, beginAtZero: true }
      }
    }
  });
}

loadFiles();
</script>
</body>
</html>
